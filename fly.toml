# fly.io deployment config — alternative to Render.
# Setup: install flyctl, then `fly launch --copy-config --no-deploy`,
# `fly secrets set FRED_API_KEY=... ACCESS_PASSWORD=...`, `fly deploy`.

app = "trading-ops"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ACCESS_USER = "trader"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
