exchanges:
  binance:
    api_key: "${BINANCE_API_KEY}"
    secret: "${BINANCE_SECRET}"
    sandbox: false
    rate_limit: 1200
    options:
      defaultType: spot

  coinbase:
    api_key: "${COINBASE_API_KEY}"
    secret: "${COINBASE_SECRET}"
    sandbox: false
    rate_limit: 1000
    options:
      defaultType: spot

oanda:
  account_id: "${OANDA_ACCOUNT_ID}"
  access_token: "${OANDA_ACCESS_TOKEN}"
  environment: "${OANDA_ENVIRONMENT}"
  practice_url: "https://api-fxpractice.oanda.com"
  live_url: "https://api-fxtrade.oanda.com"
  stream_practice_url: "https://stream-fxpractice.oanda.com"
  stream_live_url: "https://stream-fxtrade.oanda.com"
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
    - XAU_USD

arbitrage:
  pairs:
    - USDC/USDT
    - USDC/USD
    - USDT/USD
  min_spread: 0.0005
  poll_interval: 1.5
  max_position: 10000
  exchanges:
    - binance
    - coinbase

scalper:
  timeframes:
    structure: M15
    entry: M5
    trigger: M1
  min_confluence: 60
  max_risk_pct: 0.5
  min_rr: 2.0
  max_positions: 3
  cooldown_seconds: 300

swing:
  timeframes:
    structure: D1
    entry: H4
    trigger: H1
  min_confluence: 65
  max_risk_pct: 1.0
  min_rr: 3.0
  max_positions: 2
  partial_tp:
    - 1.0
    - 2.0

risk:
  global_max_drawdown_pct: 5.0
  kill_switch_enabled: true
  max_daily_loss_pct: 2.0
  correlation_check: true

dashboard:
  host: "0.0.0.0"
  port: 8080
  ws_port: 8081

learning:
  analysis_interval_hours: 24
  min_sample_size: 20
  max_param_change_pct: 10
